name: Documentation dependency lock
on:
  push:
    branches: [main]
    paths: [.github/workflows/docs-lock.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-lock
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve the targeted documentation security fix
        working-directory: apps/docs
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=low
      - name: Commit the generated lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/docs/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(docs): lock patched cookie without downgrading SvelteKit'
            git push origin HEAD:main
          fi
      - name: Check translations and warning-free static build
        working-directory: apps/docs
        run: |
          npm run test:content
          npm run check
          npm run build
      - name: Browser prerequisites
        working-directory: apps/docs
        run: npx playwright install --with-deps chromium
      - name: Bilingual browser contracts
        working-directory: apps/docs
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: documentation-bootstrap-evidence
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          retention-days: 7
