name: Rust contracts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Compile and test
        run: cargo +1.85.0 test --workspace --all-targets
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
      - name: Build host and independent TCK
        run: cargo +1.85.0 build --workspace
      - name: Black-box contracts
        run: cargo +1.85.0 run -p tessembly-conformance -- --report conformance-report.json -- target/debug/tessembly${{ runner.os == 'Windows' && '.exe' || '' }} test-port
      - name: Static examples
        run: cargo +1.85.0 run -p tessembly-cli -- lint --profile rfc2 --deny-unsat examples/*.tsm
      - name: Dependency and result evidence
        if: always()
        run: |
          test ! -f Cargo.lock || cat Cargo.lock
          test ! -f conformance-report.json || cat conformance-report.json
