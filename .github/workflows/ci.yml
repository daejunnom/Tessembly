name: Rust contracts
on:
  push:
    branches: [main]
    paths:
      - crates/**
      - examples/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - docs/**
      - .github/workflows/ci.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Compile and test reference libraries
        run: cargo +1.85.0 test --locked --workspace --all-targets
      - name: Clippy
        run: cargo +1.85.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Build reference host and external integrator tools
        run: cargo +1.85.0 build --locked --workspace
      - name: Reference smoke with external compact TCK
        run: cargo +1.85.0 run --locked -p tessembly-conformance -- --report conformance-report.json -- target/debug/tessembly${{ runner.os == 'Windows' && '.exe' || '' }} test-port
      - name: Reference smoke with external document TCK
        run: cargo +1.85.0 run --locked -p tessembly-conformance --bin tessembly-document-tck -- --report document-conformance-report.json -- target/debug/tessembly${{ runner.os == 'Windows' && '.exe' || '' }} doc-port
      - name: Check supplied examples
        run: |
          cargo +1.85.0 run --locked -p tessembly-cli -- lint --profile rfc2 --deny-unsat examples/*.tsm
          cargo +1.85.0 run --locked -p tessembly-cli -- doc-check --deny-unsat examples/advanced/*.tsmd
      - name: Keep conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ runner.os }}
          path: |
            conformance-report.json
            document-conformance-report.json
          retention-days: 14
