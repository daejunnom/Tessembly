name: Comparator source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/profile-review"
          git archive HEAD --format=tar.gz > "$RUNNER_TEMP/profile-review/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/profile-review/source-commit.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: comparator-source
          path: ${{ runner.temp }}/profile-review/
          retention-days: 3
