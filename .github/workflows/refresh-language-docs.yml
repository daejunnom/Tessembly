name: Refresh and verify implemented language documentation
on:
  push:
    branches: [main]
    paths: ['.github/docs-refresh/**', '.github/workflows/refresh-language-docs.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-docs-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply reviewed documentation updates
        run: |
          node .github/docs-refresh/update.mjs
          node .github/docs-refresh/text.mjs
          node scripts/sync-language-reference.mjs
      - name: Build native help and verify displayed examples
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 test --locked --workspace --all-targets
          cargo +1.85.0 build --locked -p tessembly-cli
          node scripts/sync-language-reference.mjs --check
          node scripts/check-documentation.mjs target/debug/tessembly
      - name: Verify bilingual content, types and static build
        working-directory: apps/docs
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=low
          npm run test:content
          npm run check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Commit only tested documentation without rewriting history
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          git add README.md docs apps/docs packages/npm/README.md packages/npm/README.ko.md scripts/check-documentation.mjs scripts/sync-language-reference.mjs
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in README.md|docs/*|apps/docs/*|packages/npm/README.md|packages/npm/README.ko.md|scripts/check-documentation.mjs|scripts/sync-language-reference.mjs) ;; *) echo "Unexpected path: $path"; exit 1;; esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: synchronize implemented supply syntax, generated help and independent example checks'
          git push origin HEAD:main
      - name: Preserve source and test evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/docs-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/docs-evidence/source-commit.txt"
          git diff --binary HEAD > "$RUNNER_TEMP/docs-evidence/uncommitted.patch"
          git archive HEAD --format=tar.gz > "$RUNNER_TEMP/docs-evidence/source.tar.gz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: refreshed-docs-source
          path: ${{ runner.temp }}/docs-evidence
          retention-days: 3
          if-no-files-found: error
