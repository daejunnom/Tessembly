name: Apply and test approved supply filters
on:
  push:
    branches: [main]
    paths: ['.github/f1f2/**', '.github/workflows/apply-f1f2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-f1f2
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'daejunnom/Tessembly' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24', package-manager-cache: false }
      - name: Apply hash-pinned source changes only
        run: node .github/f1f2/apply.mjs
      - name: Compile and exercise implementation before committing
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          cargo +1.85.0 fmt --all
          cargo +1.85.0 fmt --manifest-path bindings/wasm/Cargo.toml
          cargo +1.85.0 test --locked --workspace --all-targets
          cargo +1.85.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.85.0 build --locked --workspace
          target/debug/tessembly-tck --report conformance-report.json -- target/debug/tessembly test-port
          target/debug/tessembly-document-tck --report document-conformance-report.json -- target/debug/tessembly doc-port
          target/debug/tessembly-filter-tck --report filter-conformance-report.json -- target/debug/tessembly test-port
          cargo +1.85.0 test --locked --offline --manifest-path bindings/wasm/Cargo.toml
          cargo +1.85.0 clippy --locked --offline --manifest-path bindings/wasm/Cargo.toml -- -D warnings
          cargo +1.85.0 build --locked --offline --manifest-path bindings/wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp bindings/wasm/target/wasm32-unknown-unknown/release/tessembly_wasm.wasm packages/npm/tessembly.wasm
          (cd packages/npm && npm test && npm run check:package)
      - name: Commit tested code on main without changing documents or rewriting history
        run: |
          node .github/f1f2/apply.mjs stage
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(filters): add bounded F1/F2 supply logic, counts, windows and occurrence selectors'
          git push origin HEAD:main
      - name: Preserve exact evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/f1f2-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/f1f2-evidence/source-commit.txt"
          git diff --binary HEAD > "$RUNNER_TEMP/f1f2-evidence/uncommitted.patch"
          git archive HEAD --format=tar.gz > "$RUNNER_TEMP/f1f2-evidence/source.tar.gz"
          find . -maxdepth 1 -name '*conformance-report.json' -exec cp '{}' "$RUNNER_TEMP/f1f2-evidence/" ';'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: f1f2-tested-source
          path: ${{ runner.temp }}/f1f2-evidence/
          retention-days: 3
          if-no-files-found: error
