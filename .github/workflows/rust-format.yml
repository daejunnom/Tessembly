name: Format Rust sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/rust-format.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Install the pinned formatter
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - name: Format Rust only
        run: cargo +1.85.0 fmt --all
      - name: Commit only formatted Rust sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'crates/**/*.rs'
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Rust sources with the pinned rustfmt'
            git push origin HEAD:main
          fi
