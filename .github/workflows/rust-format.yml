name: Format Rust sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/rust-format.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install the pinned formatter
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - name: Format native and Wasm Rust sources
        run: |
          cargo +1.85.0 fmt --all
          cargo +1.85.0 fmt --manifest-path bindings/wasm/Cargo.toml
      - name: Commit only formatted Rust sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'crates/**/*.rs' 'bindings/wasm/src/*.rs'
          if ! git diff --cached --quiet; then
            git commit -m 'style: format native i18n and dependency-free Wasm sources'
            git push origin HEAD:main
          fi
