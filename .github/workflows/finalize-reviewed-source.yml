name: Finalize bounded external-tool diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-reviewed-source.yml', '.github/migrations/final-report.patch']
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { ref: '${{ github.sha }}', fetch-depth: 2 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24', package-manager-cache: false }
      - name: Apply exact reviewed four-file change
        run: |
          test "$(git rev-parse HEAD^)" = 914403392cdfe84afdafaf5249d3bd5af4366c29
          echo '329c9d5e99ed104b8f76dbb9518e23f9672a23ef13ca631d5fc9623653fa945e  .github/migrations/final-report.patch' | sha256sum --check
          git apply --check .github/migrations/final-report.patch
          git apply .github/migrations/final-report.patch
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          cargo +1.85.0 fmt --all
          cargo +1.85.0 test --locked -p tessembly-conformance
          cargo +1.85.0 clippy --locked -p tessembly-conformance --all-targets -- -D warnings
      - name: Commit only tested external-tool sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/tessembly-conformance/src/lib.rs crates/tessembly-conformance/src/main.rs crates/tessembly-conformance/src/bin/document.rs crates/tessembly-conformance/tests/transport.rs
          git commit -m 'fix(tck): bound retained diagnostics and stop after a broken host transport'
          git push origin HEAD:main
