name: npm package contracts
on:
  push:
    branches: [main]
    paths: ['packages/npm/**', 'bindings/wasm/**', 'crates/**', 'Cargo.toml', 'LICENSE', 'scripts/release-contract*', 'apps/docs/tests-npm/**', '.github/workflows/npm.yml', '.github/workflows/npm-release.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release identity, license and failure contracts
        run: node --test scripts/release-contract.test.mjs
      - name: Build Rust-only Wasm with no registry dependencies
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          cargo +1.85.0 test --locked --offline --manifest-path bindings/wasm/Cargo.toml
          cargo +1.85.0 clippy --locked --offline --manifest-path bindings/wasm/Cargo.toml -- -D warnings
          cargo +1.85.0 build --locked --offline --manifest-path bindings/wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp bindings/wasm/target/wasm32-unknown-unknown/release/tessembly_wasm.wasm packages/npm/tessembly.wasm
          cargo +1.85.0 metadata --locked --offline --manifest-path bindings/wasm/Cargo.toml --format-version 1 > /tmp/wasm-deps.json
          node -e 'const m=require("/tmp/wasm-deps.json"); if(m.packages.some(p=>p.source!==null || p.license!=="MIT")) process.exit(1); console.log("External Rust dependencies: 0; local crate licenses: MIT")'
      - name: Check Node 24 API and package contents
        working-directory: packages/npm
        run: |
          npm test
          npm run check:package
          npm pack --ignore-scripts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const p = JSON.parse(fs.readFileSync('package.json'));
          const file = `${p.name}-${p.version}.tgz`;
          const integrity = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(file)).digest('base64');
          const license_sha256 = crypto.createHash('sha256').update(fs.readFileSync('LICENSE')).digest('hex');
          fs.writeFileSync('build-info.json', JSON.stringify({ name: p.name, version: p.version, source_commit: process.env.GITHUB_SHA, file, integrity, license: p.license, license_sha256 }) + '\n');
          NODE
          sha256sum *.tgz > SHA256SUMS
      - name: Inspect the actual tarball without executing package code
        run: |
          mkdir /tmp/tessembly-artifact-check
          cp packages/npm/*.tgz packages/npm/build-info.json packages/npm/SHA256SUMS /tmp/tessembly-artifact-check/
          EXPECTED_VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/npm/package.json","utf8")).version') EXPECTED_SHA="$GITHUB_SHA" node scripts/release-contract.mjs inspect /tmp/tessembly-artifact-check
      - name: Exercise installed tarball without lifecycle scripts
        run: |
          PACKAGE_FILE=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("packages/npm/build-info.json","utf8")).file)')
          mkdir /tmp/tessembly-consumer
          cd /tmp/tessembly-consumer
          npm init -y > /dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/packages/npm/$PACKAGE_FILE"
          npm ls --all
          node --input-type=module -e 'import {createTessembly} from "tessembly";const t=await createTessembly();if(t.checkPattern("P7:D(I<T<I)").draw!=="UNSAT")process.exit(1);console.log("INSTALLED_TARBALL_OK");t.dispose();'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check supported Node 22 API
        working-directory: packages/npm
        run: npm test
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated browser-test tooling
        working-directory: apps/docs
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Exercise the installed browser package in three locales
        working-directory: apps/docs
        env:
          NPM_TEST_PACKAGE_DIR: /tmp/tessembly-consumer/node_modules/tessembly
        run: npx playwright test --config playwright.npm.config.ts
      - uses: actions/upload-artifact@v6
        with:
          name: tessembly-npm-package
          path: |
            packages/npm/*.tgz
            packages/npm/SHA256SUMS
            packages/npm/build-info.json
          retention-days: 14
