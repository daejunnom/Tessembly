name: Apply and verify RFC3 comparator alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-rfc3.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate and apply reviewed source delta
        run: |
          node .github/migrations/apply-rfc3.mjs
          node .github/migrations/correct-current-wire-fixture.mjs
      - name: Compile and test before committing source
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          cargo +1.85.0 fmt --all
          cargo +1.85.0 fmt --manifest-path bindings/wasm/Cargo.toml
          cargo +1.85.0 test --locked --workspace --all-targets
          cargo +1.85.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.85.0 test --locked --offline --manifest-path bindings/wasm/Cargo.toml
          cargo +1.85.0 build --locked --offline --manifest-path bindings/wasm/Cargo.toml --target wasm32-unknown-unknown --release
          cp bindings/wasm/target/wasm32-unknown-unknown/release/tessembly_wasm.wasm packages/npm/tessembly.wasm
          (cd packages/npm && npm test && npm run check:package)
          node --test apps/docs/tests/content.test.mjs
      - name: Commit tested source on main without rewriting history
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const paths=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/rfc3-paths.json`));
          execFileSync('git',['add','--',...paths]);
          const changed=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');
          assert.ok(changed.every(p=>paths.includes(p)));
          const remote=execFileSync('git',['ls-remote','origin','refs/heads/main'],{encoding:'utf8'}).split(/\s/)[0];
          assert.equal(remote,process.env.EXPECTED_PARENT,'MAIN_CHANGED_DURING_REVIEW');
          execFileSync('git',['config','user.name','github-actions[bot]']);
          execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
          execFileSync('git',['commit','-m','fix(semantics): align RFC3 order comparators and migrate RFC2 explicitly; keep filter and QB/OQB expansions unapproved'],{stdio:'inherit'});
          execFileSync('git',['push','origin','HEAD:main'],{stdio:'inherit'});
          NODE
      - name: Record tested source and diff
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rfc3-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/rfc3-evidence/source-commit.txt"
          git diff --binary > "$RUNNER_TEMP/rfc3-evidence/uncommitted.patch"
          git archive HEAD --format=tar.gz > "$RUNNER_TEMP/rfc3-evidence/source.tar.gz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: rfc3-tested-source
          path: ${{ runner.temp }}/rfc3-evidence/
          retention-days: 3
