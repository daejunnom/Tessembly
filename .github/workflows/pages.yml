name: Documentation Pages
on:
  push:
    branches: [main]
    paths: ['apps/docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install and audit the locked documentation dependencies
        working-directory: apps/docs
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=low
      - name: Record deployed source and languages
        working-directory: apps/docs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("static/build-info.json", JSON.stringify({source_commit:process.env.SOURCE_SHA,site:"Tessembly",semantic_profile:"tessembly.rfc2.precedence.v1",languages:["en","ko"]})+"\n");'
      - name: Verify complete translations and zero Svelte warnings
        working-directory: apps/docs
        run: |
          npm run test:content
          npm run check
          npm run build
      - name: Browser prerequisites
        working-directory: apps/docs
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile language contracts
        working-directory: apps/docs
        run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: documentation-browser-evidence
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/docs/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
      - name: Verify public translations and exact deployed source
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$SITE_URL" = 'https://daejunnom.github.io/Tessembly/'
          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --location --max-time 20 "${SITE_URL}build-info.json" -o /tmp/build-info.json && jq -e --arg sha "$EXPECTED_SHA" '.source_commit==$sha and .languages==["en","ko"]' /tmp/build-info.json; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          for lang in en ko; do
            for path in '' quickstart/ compact/ advanced/ state/ wire/ integrators/ tools/ npm/ platforms/ security/ scope/; do
              curl --fail --silent --show-error --location --max-time 20 "${SITE_URL}${lang}/${path}" -o /tmp/page.html
              grep -q "lang=\"${lang}\"" /tmp/page.html
              grep -q 'Tessembly' /tmp/page.html
              echo "PUBLIC_OK ${lang}/${path}"
            done
          done
          echo "Verified bilingual source: $EXPECTED_SHA"
