name: Publish npm package
run-name: npm ${{ inputs.expected_version }} / ${{ inputs.mode }} / OIDC
on:
  workflow_dispatch:
    inputs:
      mode:
        description: verify-only does NOT test npm authorization. publish uploads the verified MIT artifact with OIDC.
        type: choice
        options: [verify-only, publish]
        default: verify-only
        required: true
      expected_version:
        description: Must equal the intentionally committed npm package version. Never overwrites an existing version.
        type: string
        default: '0.1.1'
        required: true
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/npm.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_SHA: ${{ github.sha }}
      NODE_AUTH_TOKEN: ''
      NPM_TOKEN: ''
      NPM_ID_TOKEN: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: tessembly-npm-package
          path: .release-package
      - name: Verify exact MIT artifact identity and integrity
        run: |
          (cd .release-package && sha256sum --check SHA256SUMS)
          node scripts/release-contract.mjs check-registry .release-package
      - name: Prepare isolated token-free npm configuration
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/tessembly-oidc.npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/tessembly-oidc-global.npmrc
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in verify-only|publish) ;; *) echo 'Invalid release mode'; exit 1;; esac
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          : > "$NPM_CONFIG_GLOBALCONFIG"
          printf 'NPM_CONFIG_USERCONFIG=%s\nNPM_CONFIG_GLOBALCONFIG=%s\n' "$NPM_CONFIG_USERCONFIG" "$NPM_CONFIG_GLOBALCONFIG" >> "$GITHUB_ENV"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const node = process.versions.node.split('.').map(Number);
          const npmText = execFileSync('npm', ['--version'], {encoding:'utf8'}).trim();
          const npm = npmText.split('.').map(Number);
          const atLeast = (v, min) => v[0] > min[0] || v[0] === min[0] && (v[1] > min[1] || v[1] === min[1] && v[2] >= min[2]);
          if (!atLeast(node,[22,14,0]) || !atLeast(npm,[11,5,1])) throw new Error('NPM_OIDC_TOOLCHAIN_UNSUPPORTED');
          console.log(`Node ${process.versions.node}; npm ${npmText}; GitHub OIDC endpoint available (npm permission not yet verified).`);
          NODE
      - name: Explain verification-only result
        if: inputs.mode == 'verify-only'
        run: |
          echo 'MIT artifact verified. Nothing was published. npm Trusted Publisher authorization has NOT been tested.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the verified MIT package using OIDC only
        if: inputs.mode == 'publish'
        working-directory: .release-package
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_ID_TOKEN NPM_CONFIG_TOKEN NPM_CONFIG__AUTH npm_config__auth
          npm publish "./tessembly-${EXPECTED_VERSION}.tgz" --registry=https://registry.npmjs.org/ --access public --ignore-scripts --provenance
      - name: Confirm registry version, MIT license and integrity
        if: inputs.mode == 'publish'
        run: |
          node scripts/release-contract.mjs confirm .release-package
          echo "Published and verified tessembly@${EXPECTED_VERSION}: MIT, expected SHA-512 and zero npm dependencies. OIDC-only workflow; no bootstrap token was loaded." >> "$GITHUB_STEP_SUMMARY"
