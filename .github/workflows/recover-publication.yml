name: Recover published 0.1.1 evidence
on:
  push:
    branches: [main]
    paths: ['docs/release-receipts/**', 'scripts/release-contract.mjs', '.github/workflows/recover-publication.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24', package-manager-cache: false }
      - name: Read-only confirmation of original immutable release
        run: node scripts/release-contract.mjs recover docs/release-receipts/0.1.1.json
