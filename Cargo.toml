[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/daejunnom/Tessembly"
license = "MIT"
publish = false

[workspace.dependencies]
tessembly-core = { path = "crates/tessembly-core" }
tessembly-text = { path = "crates/tessembly-text" }
tessembly-relations = { path = "crates/tessembly-relations" }
tessembly-codec = { path = "crates/tessembly-codec" }
serde_json = "=1.0.145"
